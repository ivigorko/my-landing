name: Check Yandex.Metrika on all pages

on:
  pull_request:
    branches: [main]

# Only newer runs of this workflow for the same PR cancel older ones.
# Other PRs and deployment workflows have separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-check:
    name: Verify site (Metrika, Four Paws, schedule, publication)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all site checks
        run: python -X utf8 tools/preflight.py
